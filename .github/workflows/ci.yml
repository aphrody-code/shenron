name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DISCORD_TOKEN: test-token
  GUILD_ID: "1497167233280118896"
  OWNER_ID: "11111111111111111"
  DATABASE_PATH: "./data/test-ci.db"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cible de prod = linux uniquement (systemd VPS + Docker Fly). Le binaire
        # natif skia (@aphrody-code/canvas) n'est publié que pour linux-x64-gnu :
        # sur macOS aucun binding n'existe et mock.module ne peut pas intercepter
        # l'import statique → faux échec. On ne teste donc que linux.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Match the VPS Bun that writes bun.lock (lockfileVersion 2 +
          # configVersion 0); `latest` (stable <1.4) errors "Unknown lockfile
          # version".
          bun-version: 1.4.0-canary.1
      - name: Cache ~/.bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ matrix.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ matrix.os }}-

      - name: Auth GitHub Packages (@aphrody-code/*, @rpbey/*)
        env:
          GH_PKG: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          printf "@rpbey:registry=https://npm.pkg.github.com\n@aphrody-code:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n" "$GH_PKG" > .npmrc
          printf "@rpbey:registry=https://npm.pkg.github.com\n@aphrody-code:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n" "$GH_PKG" > ~/.npmrc

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate entries barrel
        run: bun --filter @shenron/bot gen:entries

      - name: Type-check
        run: bun run type-check

      - name: Lint (oxlint)
        run: bun run lint

      - name: Tests (every scope, strict — fails on any uncovered scope)
        # Custom runner covers EVERY workspace member (turbo skips script-less
        # ones); --strict fails the build on a zero-test scope; the live tier
        # (site no-404 prod crawler) is opt-in (--live) and stays out of CI.
        run: bun run test:ci

      # Pas de step build ici : la cible de prod n'a pas de bundle préalable.
      # - Le bot tourne `bun src/index.ts` en direct (systemd VPS + Docker Fly),
      #   jamais le binaire `--compile`. Le binaire standalone (bundling du
      #   dashboard HTML/CSS + assets fonts) est produit séparément par
      #   release.yml sur tags v* ; il n'est sur aucun chemin de déploiement.
      # - Le site est buildé et validé par le deploy Vercel sur push main.
      # - `turbo run build` est exclu : il lancerait le `build: tsup` des
      #   packages @rpbey/* (tsup non installé ; leurs dist sont commités).
