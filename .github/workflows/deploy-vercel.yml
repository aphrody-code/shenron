name: Deploy site to Vercel (production)

# Auto-deploy de remplacement : le projet Vercel `dbfr` n'est pas connecté
# nativement au repo (GitHub App sans accès au repo privé), donc on déclenche
# le déploiement prod ici sur chaque push `main`. `vercel deploy --prod` upload
# la source et laisse Vercel builder (rootDirectory=apps/site côté projet).
#
# Pipeline : push main -> (migrate-prod, conditionnel) -> deploy.
# Les migrations Drizzle de prod sont appliquées AVANT le déploiement, et
# seulement si le schéma/les migrations ont changé (gate dorny/paths-filter).
# `drizzle-kit migrate` est idempotent (table drizzle.__drizzle_migrations) ;
# la connexion prod est résolue à la volée via neonctl + NEON_API_KEY (jamais
# loggée). Cf. docs/neon-automation.md.

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - "vercel.json"
      - ".github/workflows/deploy-vercel.yml"
  workflow_dispatch: {}

concurrency:
  group: vercel-prod
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # Migrations prod : uniquement si le schéma / les migrations Drizzle ont changé
  # ----------------------------------------------------------------------------
  migrate-prod:
    name: Migrate production Neon branch
    runs-on: ubuntu-latest
    environment: production
    outputs:
      changed: ${{ steps.filter.outputs.schema }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect schema / migration changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            schema:
              - "apps/site/src/db/schema.ts"
              - "apps/site/src/db/migrations/**"
              - "apps/site/drizzle.config.ts"

      - uses: oven-sh/setup-bun@v2
        if: steps.filter.outputs.schema == 'true'
        with:
          bun-version: canary

      # @aphrody/canvas is on public npm and @rpbey/* are in-repo workspaces,
      # so no GitHub Packages auth is needed.
      - name: Install
        if: steps.filter.outputs.schema == 'true'
        run: bun install --frozen-lockfile

      - name: Apply Drizzle migrations to production
        # Résout la connection string de la branche Neon par défaut (= prod) via
        # neonctl + NEON_API_KEY (jamais loggée : passée par env à drizzle-kit).
        # `migrate` est idempotent — applique uniquement les migrations non encore
        # enregistrées dans drizzle.__drizzle_migrations.
        if: steps.filter.outputs.schema == 'true'
        working-directory: apps/site
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          DATABASE_URL="$(bunx neonctl@2 connection-string \
            --api-key "$NEON_API_KEY" \
            --project-id "$NEON_PROJECT_ID" \
            --database-name neondb \
            --pooled)"
          export DATABASE_URL
          bunx drizzle-kit migrate

  # ----------------------------------------------------------------------------
  # Déploiement prod : attend la migration (skip transparent si rien à migrer)
  # ----------------------------------------------------------------------------
  deploy:
    needs: migrate-prod
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest has no Bun preinstalled — without this the next step died
      # with `bun: command not found` (exit 127), so no deploy ever ran.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Install Vercel CLI
        run: bun install -g vercel@latest
      - name: Deploy (production)
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
