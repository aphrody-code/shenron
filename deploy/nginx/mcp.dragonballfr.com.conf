# mcp.dragonballfr.com — Serveur MCP public (proxy vers Bun.serve :5010)
# Expose le RAG + l'API publique Dragon Ball comme outils MCP (Streamable HTTP,
# lecture seule, sans auth). Consommé par Claude web/desktop, Grok, Gemini,
# Ollama (bridge)… La CORS (`*`) + la préflight OPTIONS sont gérées par l'app
# Bun elle-même : nginx NE pose PAS d'en-tête CORS ici (sinon doublon → rejet
# navigateur) et laisse passer OPTIONS jusqu'à l'app.
# Prérequis : zone `limit_req zone=rpb_api …` dans nginx.conf (http{}).

upstream shenron_mcp {
    server 127.0.0.1:5010;
    keepalive 16;
}

server {
    listen 80;
    server_name mcp.dragonballfr.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name mcp.dragonballfr.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.dragonballfr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.dragonballfr.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_mcpdbfr:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* "\.(env|git/|aws/|ssh/|sql|bak|old|swp|DS_Store)$" { return 410; }

    access_log /var/log/nginx/mcp-dragonballfr-access.log;
    error_log  /var/log/nginx/mcp-dragonballfr-error.log warn;
    client_max_body_size 4m;

    # Tout → serveur MCP (Bun :5010). CORS + OPTIONS gérés par l'app.
    location / {
        limit_req zone=rpb_api burst=50 nodelay;
        proxy_pass http://shenron_mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Streamable HTTP : tolère une réponse longue (génération rag_ask) sans
        # bufferiser (le flux JSON/SSE doit passer en continu). Cap MCP = 300s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
