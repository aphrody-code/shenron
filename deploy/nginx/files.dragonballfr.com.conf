# files.dragonballfr.com — Serveur de fichiers + upload (Filebrowser, proxy :8081)
# Filebrowser tourne en loopback (service systemd `filebrowser`), auth JSON
# (login obligatoire). nginx termine TLS/HTTP3, rate-limite le login (anti
# brute-force) et autorise les gros uploads.
# Prérequis : zones `limit_req zone=rpb_api …` et `zone=files_login …` (http{}).

upstream shenron_files {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    server_name files.dragonballfr.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name files.dragonballfr.com;

    ssl_certificate     /etc/letsencrypt/live/files.dragonballfr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.dragonballfr.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_filesdbfr:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* "\.(env|git/|aws/|ssh/|sql|bak|old|swp|DS_Store)$" { return 410; }

    access_log /var/log/nginx/files-dragonballfr-access.log;
    error_log  /var/log/nginx/files-dragonballfr-error.log warn;

    # Uploads volumineux (2 Go). Ajuster selon l'espace disque.
    client_max_body_size 2g;
    client_body_timeout 300s;

    # Login = surface brute-force → rate-limit strict dédié.
    location = /api/login {
        limit_req zone=files_login burst=5 nodelay;
        proxy_pass http://shenron_files;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=rpb_api burst=50 nodelay;
        proxy_pass http://shenron_files;
        proxy_http_version 1.1;
        # Websocket (aperçu / événements filebrowser).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Uploads/downloads longs.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
