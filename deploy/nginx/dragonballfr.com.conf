# dragonballfr.com — site Next.js 16 (apex), servi par next start sous Bun sur
# 127.0.0.1:3000 (unit systemd shenron-site.service). Migré de Vercel vers le VPS.
# nginx termine TLS/HTTP3 + rate-limit /api/ ; Next gère routing, ISR, le rewrite
# /wiki/* et le middleware (proxy.ts) en process (comme sur Vercel). L'API du bot
# reste sur bot.dragonballfr.com (vhost séparé) ; le site la consomme via cet hôte.

upstream shenron_site {
    # Ligne `server` GÉNÉRÉE par scripts/ops/deploy-site.ts : c'est le seul endroit
    # où nginx apprend quel slot sert le trafic (bascule bleu/vert slot A :3000 /
    # slot B :3010). Le fichier est créé par `deploy-site.ts install`, qui doit
    # donc tourner avant tout `nginx -t` sur ce vhost.
    include /etc/nginx/shenron-upstreams/shenron_site.conf;
    # Pool de connexions keepalive vers Next : évite le coût handshake TCP à
    # chaque requête proxifiée (le site est mono-upstream, fort trafic pages+API).
    keepalive 64;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

# ── apex :80 — ACME + redirection HTTPS ─────────────────────────────────────
server {
    listen 80;
    server_name dragonballfr.com www.dragonballfr.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://dragonballfr.com$request_uri; }
}

# ── www :443 — 301 vers l'apex (canonique, cf. CLAUDE.md) ────────────────────
server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name www.dragonballfr.com;

    ssl_certificate     /etc/letsencrypt/live/dragonballfr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dragonballfr.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_dbfr:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://dragonballfr.com$request_uri;
}

# ── apex :443 — site Next.js ────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name dragonballfr.com;

    ssl_certificate     /etc/letsencrypt/live/dragonballfr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dragonballfr.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_dbfr:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/dragonballfr-access.log;
    error_log  /var/log/nginx/dragonballfr-error.log warn;

    # Éditeur wiki-admin (upload images, multipart et base64 dans le JSON) —
    # marge confortable au-dessus du plafond applicatif (50 Mo, cf. ImageField.tsx).
    client_max_body_size 60m;

    # Sondes scanners → 410 (le site ne sert aucun de ces chemins).
    location ~* "\.(env|git/|aws/|ssh/|sql|bak|old|swp|DS_Store)$" { return 410; }

    # Page d'erreur de marque servie PAR NGINX quand l'upstream est injoignable
    # (restart shenron-site, stall mémoire, timeout) — l'utilisateur voit un écran
    # DBFR au lieu du 502/504 brut de nginx. Uniquement les erreurs générées par
    # nginx (connexion/timeout upstream) ; les 5xx applicatifs restent rendus par
    # Next (pas de proxy_intercept_errors). Fichier déployé par deploy/install.sh.
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/html;
        internal;
        add_header Cache-Control "no-store" always;
    }

    # Assets buildés immutables — Next pose déjà Cache-Control immutable (next.config
    # headers()) ; on relaie tel quel, sans rate-limit (nombreux chunks au 1er load).
    location /_next/static/ {
        proxy_pass http://shenron_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
    }

    # Optimiseur d'images Next (next/image). Réponses volumineuses avec leur
    # propre Cache-Control (minimumCacheTTL) → buffering ON (ne bloque pas un
    # worker upstream sur un client lent) + read-timeout large pour la 1re
    # transformation. Pas de rate-limit (une page = plusieurs vignettes).
    location /_next/image {
        proxy_pass http://shenron_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering on;
    }

    # Routes API + auth Next (better-auth, telemetry, chat LLM streaming…) :
    # rate-limit + buffering off (streaming SSR/LLM + Set-Cookie immédiat).
    location /api/ {
        limit_req zone=rpb_api burst=30 nodelay;
        proxy_pass http://shenron_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Pages (SSR/ISR/RSC streaming) → Next. X-Forwarded-Proto https est REQUIS
    # pour que better-auth pose des cookies `Secure` et garde l'OAuth en https.
    location / {
        proxy_pass http://shenron_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
