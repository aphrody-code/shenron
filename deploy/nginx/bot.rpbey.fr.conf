# bot.rpbey.fr — API publique du bot Shenron (proxy vers Bun.serve :5006)
# Endpoint public consommé par le site Vercel (dbfr) : /api/public/*,
# /api/canvas/*, /api/* (admin via Bearer SHENRON_ADMIN_TOKEN). Réutilise
# l'upstream `shenron_api` défini dans shenron.conf. shenron.rpbey.fr pointe
# désormais vers Vercel (le site) ; le bot vit ici côté VPS.

server {
    listen 80;
    server_name bot.rpbey.fr;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name bot.rpbey.fr;

    ssl_certificate     /etc/letsencrypt/live/bot.rpbey.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.rpbey.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_botrpb:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS — autorise le site (server-side n'en a pas besoin, mais le client
    # peut fetch /api/canvas en <img>/JS depuis dbfr.vercel.app).
    set $cors_origin "";
    if ($http_origin ~* "^https://(dbfr\.vercel\.app|shenron\.rpbey\.fr|[a-z0-9-]+\.vercel\.app)$") { set $cors_origin $http_origin; }
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Access-Control-Max-Age 86400 always;
    if ($request_method = OPTIONS) { return 204; }

    location ~* "\.(env|git/|aws/|ssh/|sql|bak|old|swp|DS_Store)$" { return 410; }

    access_log /var/log/nginx/bot-rpbey-access.log;
    error_log  /var/log/nginx/bot-rpbey-error.log warn;
    client_max_body_size 12m;

    # Canvas (Skia) — timeout étendu + cache court
    location ~ "^/api/canvas/" {
        limit_req zone=rpb_api burst=20 nodelay;
        proxy_pass http://shenron_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_cache_valid 200 60s;
    }

    # Tout le reste → bot (API publique + admin Bearer)
    location / {
        limit_req zone=rpb_api burst=50 nodelay;
        proxy_pass http://shenron_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
}
