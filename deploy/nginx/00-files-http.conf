# Directives http{} requises par files.dragonballfr.com.conf (serveur de fichiers).
# Chargé avant les vhosts (préfixe 00-). Inclus dans http{} via conf.d/*.conf.

# Map websocket Upgrade (filebrowser : aperçu / événements).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Rate-limit strict du login filebrowser (anti brute-force) : 1 req/s.
limit_req_zone $binary_remote_addr zone=files_login:10m rate=1r/s;
