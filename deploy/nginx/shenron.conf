# ══════════════════════════════════════════════════════════
# shenron.rpbey.fr — Bot Discord DBZ + dashboard SPA
# ══════════════════════════════════════════════════════════
#
# Stack : Bun.serve sur 127.0.0.1:5006 (apps/shenron/src/index.ts)
# - SPA React 19 servie via HTML import (chunks /chunk-*.{js,css} générés
#   au runtime par le bundler Bun, hash dans le nom → immutable cacheable)
# - API REST tscord-compatible : /api/*, /auth/*
# - OAuth2 Discord : /auth/discord, /auth/callback (whitelist OWNER_ID +
#   OAUTH_ALLOWED_USERS, cookie session HMAC SHA-256, 7 jours)
#
# Cert :
#   sudo certbot --nginx -d shenron.rpbey.fr
#
# Rate limits :
#   - SPA + chunks : pas de limit (immutable static)
#   - API : 30 r/s burst 50 (zone rpb_api dans nginx.conf)
#
# Timeouts :
#   - default : 30s read (suffit pour la plupart des routes)
#   - /api/canvas/* : 60s read (Skia rendering peut être long sur fusion)
#
# Activer :
#   sudo cp infra/nginx/shenron.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx

upstream shenron_api {
    server 127.0.0.1:5006;
    keepalive 16;
    keepalive_requests 500;
    keepalive_timeout 60s;
}

# HTTP → HTTPS + ACME challenge
server {
    listen 80;
    server_name shenron.rpbey.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — proxy vers Bun.serve
server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name shenron.rpbey.fr;

    ssl_certificate     /etc/letsencrypt/live/shenron.rpbey.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shenron.rpbey.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_shenron:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTP/3 advertisement
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # ── Headers de sécurité ───────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # CSP : SPA Bun.serve, pas de inline scripts. Tailwind injecte des styles
    # inline (max compatibility), donc 'unsafe-inline' sur style. Avatars Discord
    # via cdn.discordapp.com, fonts inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.discordapp.com https://*.discordapp.net; font-src 'self' data:; connect-src 'self' https://discord.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ── CORS — same-origin only (le dashboard est servi par shenron) ──
    # Le cookie session est SameSite=Lax → pas besoin de CORS credentials.
    # Pour intégration externe via Bearer, on ajoute Origin echo strict.
    set $cors_origin "";
    if ($http_origin ~* "^https://shenron\.rpbey\.fr$") { set $cors_origin $http_origin; }
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Cookie" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Max-Age 86400 always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # ── Block scanners ────────────────────────────────────────────────
    # Bots qui cherchent .env, .git, wordpress, phpmyadmin… → 410 Gone
    # 410 (vs 404) coupe le crawl plus rapidement chez les scanners polis.
    location ~* "\.(env|git/|aws/|ssh/|sql|bak|old|swp|DS_Store)$" { return 410; }
    location ~* "/(wp-(admin|login|content|includes)|wordpress|phpmyadmin|pma|cgi-bin)/" { return 410; }
    location = /.env { return 410; }
    location = /.git/config { return 410; }

    # ── Logs ──────────────────────────────────────────────────────────
    access_log /var/log/nginx/shenron-access.log;
    error_log  /var/log/nginx/shenron-error.log warn;

    # Body max — uploads d'avatar/banner futurs (Discord max 10 MB)
    client_max_body_size 12m;
    client_body_timeout 30s;

    # ── Chunks SPA — immutable cache ──────────────────────────────────
    # Bun.serve génère /chunk-<hash>.js et /chunk-<hash>.css au boot. Le
    # hash invalide automatiquement le cache à chaque rebuild → safe to
    # cache forever.
    location ~ "^/chunk-[a-z0-9]+\.(js|css|map)$" {
        proxy_pass http://shenron_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_cache_valid 200 1h;

        # client + CDN cache 1 an, immutable (hash dans le nom)
        # Re-déclare les headers globaux car add_header dans location remplace
        # tous les add_header du parent (règle nginx surprenante).
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        gzip_static on;
    }

    # ── Assets statiques (favicons, manifest, logo) ───────────────────
    location ~ "^/(favicon\.ico|favicon-\d+\.png|apple-touch-icon\.png|icon-\d+\.png|manifest\.webmanifest|assets/)" {
        proxy_pass http://shenron_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }

    # ── /api/canvas/* — Skia rendering (timeout étendu) ───────────────
    location ~ "^/api/canvas/" {
        limit_req zone=rpb_api burst=20 nodelay;
        proxy_pass http://shenron_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # Skia rendering peut prendre 5-10s sur une fusion complexe
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Buffer ON pour les images (réponse complète avant flush)
        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;

        # Cache nginx local 60s — couplé avec ETag du backend (304 conditional)
        proxy_cache_valid 200 60s;
    }

    # ── /auth/discord et /auth/callback : OAuth flow ──────────────────
    # Le state cookie est SameSite=Lax, doit survivre au redirect Discord.
    # Pas de cache, pas de buffering pour redirect 302 instantané.
    location ~ "^/auth/(discord|callback)" {
        proxy_pass http://shenron_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_buffering off;
    }

    # ── /api/* — admin endpoints ──────────────────────────────────────
    location /api/ {
        limit_req zone=rpb_api burst=50 nodelay;
        proxy_pass http://shenron_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }

    # ── /openapi : public ─────────────────────────────────────────────
    location = /openapi {
        proxy_pass http://shenron_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # ── /api (sans slash) — route ping Bun.serve ──────────────────────
    location = /api {
        proxy_pass http://shenron_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA pages — toutes les routes du dashboard ────────────────────
    # /, /login, /profile, /bot, /cron, /services, /database/*, /stats,
    # /audit, /levels, /messages, /canvas, /webhooks, /logs, /settings
    # → tous renvoient le HTML index, le client React route ensuite.
    location / {
        limit_req zone=rpb_api burst=50 nodelay;
        proxy_pass http://shenron_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }
}
