description = "Lance le sprint DBFR — 30 min chrono pour livrer toutes les tâches Track B (agent=gemini) de .coord/tasks.json"

prompt = """
# /start — Sprint DBFR 30 minutes chrono (Track B — site Vercel)

Tu es en **mode autonome maximal**. Pas de questions, pas de plan préalable, pas de demande de confirmation, pas de récap intermédiaire. Tu **exécutes** jusqu'à ce que toutes les tâches `agent=gemini` du backlog soient `done` ou que le chrono expire.

## Step 0 — Démarrage du chrono (OBLIGATOIRE en premier)

```bash
date -u +%s > /tmp/dbfr-sprint-start-gemini
DEADLINE=$(( $(cat /tmp/dbfr-sprint-start-gemini) + 1800 ))
echo "$DEADLINE" > /tmp/dbfr-sprint-deadline-gemini
echo "Chrono démarré. Deadline : $(date -u -d @$DEADLINE +%H:%M:%SZ)"
```

À chaque cycle, vérifier `[ $(date -u +%s) -lt $(cat /tmp/dbfr-sprint-deadline-gemini) ]`. Si dépassé → stop, écrire un récap court, sortir.

## Step 1 — Lecture du contrat

1. `cat PROMPT.md` (mission complète)
2. `cat GEMINI.md` (guide Track B — site Vercel)
3. `flock /tmp/dbfr-tasks.lock cat .coord/tasks.json` (backlog)

## Step 2 — Boucle d'exécution

Tant que `date < deadline` ET qu'il reste des tâches `agent=gemini` avec `status=pending` :

1. **Pick** : première tâche `agent=gemini`, `status=pending`, toutes les `deps[]` ayant `status=done` (y compris cross-track `shenron-*` !).
2. **Claim atomique** (flock) :
   ```bash
   flock /tmp/dbfr-tasks.lock bash -c "jq --arg id \\"$TID\\" --arg pid \\"$$\\" --arg now \\"$(date -u +%FT%TZ)\\" '(.tasks[] | select(.id==\\$id)) |= (.status=\\"in_progress\\" | .agent_pid=\\$pid | .started_at=\\$now)' .coord/tasks.json > /tmp/.tasks.tmp && mv /tmp/.tasks.tmp .coord/tasks.json"
   ```
3. **Exécute** selon `acceptance`. Édite les `files[]` du repo `apps/dbfr-site/` (Next.js 15 + Tailwind v4 + shadcn new-york + Prisma/Neon + next-auth Discord).
4. **Vérifie** : `pnpm build` (ou `bun run build`) doit passer après chaque tâche structurante.
5. **Commit** (FR conventional 1-ligne, pas d'emoji, pas de Co-Authored, pas de "Generated with") :
   ```bash
   git -C apps/dbfr-site add -A
   git -C apps/dbfr-site commit -m "feat(scope): <description>"
   COMMIT=$(git -C apps/dbfr-site rev-parse HEAD)
   ```
6. **Marquer done** (flock) :
   ```bash
   flock /tmp/dbfr-tasks.lock bash -c "jq --arg id \\"$TID\\" --arg hash \\"$COMMIT\\" --arg now \\"$(date -u +%FT%TZ)\\" '(.tasks[] | select(.id==\\$id)) |= (.status=\\"done\\" | .commit_hash=\\$hash | .finished_at=\\$now)' .coord/tasks.json > /tmp/.tasks.tmp && mv /tmp/.tasks.tmp .coord/tasks.json"
   ```
7. **Si blocage** > 5 min → `status=blocked`, `blocker=<raison>`, passer à la suivante.
8. **Cross-track sync** : si la tâche dépend d'une `shenron-*`, poll `.coord/tasks.json` toutes les 30 s en attendant qu'elle passe `done`. Pendant l'attente, attaque une autre tâche `gemini` indépendante.

## Step 3 — Parallélisation agressive

Tâches indépendantes (toutes `deps[]` vides ou résolues) → lance en parallèle quand le runtime le permet.

Indépendantes d'office :
- `site-01-bootstrap` (bloque tout, à faire en premier)
- Puis `site-02-prisma-schema` + `site-03-theme` (parallèle après bootstrap)
- Puis `site-04-fab-discord` + `site-05-blog` + `site-06-wiki` + `site-08-about` (parallèle)
- `site-07-shop-profil` attend `shenron-07` et `shenron-08` (poll cross-track)
- `site-09-admin-cms` attend `site-05` + `site-06`
- `site-10-deploy-vercel` = dernier

## Step 4 — Deploy Vercel final (`site-10`)

```bash
cd apps/dbfr-site
# Push GitHub
git remote add origin git@github.com:rose-griffon/dbfr.git 2>/dev/null || true
git push -u origin main

# Lier Vercel (CLI ou MCP)
vercel link --yes --project dbfr || true
vercel env add DATABASE_URL production < <(echo "$NEON_URL")
vercel env add NEXTAUTH_SECRET production < <(openssl rand -hex 32)
vercel env add DISCORD_CLIENT_ID production < <(echo "$DISCORD_CLIENT_ID")
vercel env add DISCORD_CLIENT_SECRET production < <(echo "$DISCORD_CLIENT_SECRET")
vercel env add SHENRON_API_URL production < <(echo "https://shenron.rpbey.fr")
vercel --prod
```

URL preview Vercel → l'ajouter au récap final.

## Step 5 — Récap final

```
SPRINT DBFR — RÉCAP GEMINI (Track B)
Durée : N min
Tâches done : X/10
Tâches blocked : Y (raisons : ...)
Commits : <liste hashes courts>
Deploy Vercel : <URL preview>
Track A (Claude) : <statut lu depuis .coord/tasks.json>
```

## Règles dures (interdits absolus)

- ❌ Toucher à `apps/shenron/`, `apps/rosegriffon/`, `apps/azalee/`, `apps/rpbey/`, `apps/rpb-bot/`, `apps/cdn/` (pas ta scope)
- ❌ Builder ou déployer sur le VPS (Vercel UNIQUEMENT)
- ❌ `catalog:` ou `workspace:*` dans le `package.json` final (Vercel les casse)
- ❌ Emoji dans commits / code / docs
- ❌ `Co-Authored-By: ...` ou `Generated with ...` dans les commits
- ❌ Fond blanc ou palette Discord brute dans le thème (charte galactique noir + bleu/violet obligatoire)

## Go.
"""
